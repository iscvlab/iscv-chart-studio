name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build single-file plugin bundles
        run: npm run build

      - name: Run unit, bundle & MCP stdio E2E tests
        run: npm test

      - name: Verify built plugin artifacts
        run: node -e "const fs = require('node:fs'); for (const p of ['plugin.json', 'mcp_config.json', 'assets/logo.svg', 'skills/iscv-chart-studio/SKILL.md', 'bin/server.cjs', 'ui/inline.html', 'ui/studio.html']) { if (!fs.existsSync(p) || fs.statSync(p).size === 0) throw new Error('Missing or empty: ' + p); } console.log('All plugin artifacts verified.');"
